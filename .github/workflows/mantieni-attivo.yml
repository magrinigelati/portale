# Mantiene attivo il progetto Supabase (piano gratuito: pausa dopo 7 giorni senza richieste).
# Ogni 3 giorni fa una semplice richiesta al database con la chiave pubblica.
name: Mantieni attivo il portale

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Richiesta al database
        env:
          URL: https://yulutbgvsotkwrfpbphd.supabase.co
          KEY: sb_publishable_YR4hB8YzUDLfvwSGJsufTA_7aNZaNdo
        run: |
          codice=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/dipendenti?select=id&limit=1")
          echo "Risposta: $codice"
          test "$codice" = "200"
